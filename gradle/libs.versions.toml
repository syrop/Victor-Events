firebaseCrashlyticsPlugin = "3.0.8"
coroutines = "1.11.0"
serialization = "1.12.0"
kodein = "7.33.0"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
room = "2.8.5"
nav3 = "1.2.0"
work = "2.12.0"
credentials = "1.6.0"
googleid = "1.2.1"
